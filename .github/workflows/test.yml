name: Test Gutty Pipeline

on:
  push:
    branches: [ main, nano ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linting (if available)
      run: npm run lint --if-present
      continue-on-error: true
    
    - name: Run type checking (if available) 
      run: npm run typecheck --if-present
      continue-on-error: true
    
    - name: Run core tests (CLI, LanceDB, nutrition matcher)
      run: |
        npm test -- --run test/cli.test.ts
        npm test -- --run test/real-lancedb.test.ts  
        npm test -- --run test/nutrition-matcher.test.ts
    
    - name: Test CLI commands (help)
      run: |
        npx tsx bin/cli.ts --help
        npx tsx bin/cli.ts validate --help
        npx tsx bin/cli.ts gemini-health-analyze --help
        npx tsx bin/cli.ts nutrition-index --help
        npx tsx bin/cli.ts gi-index --help
        npx tsx bin/cli.ts fodmap-index --help
    
    - name: Test CLI validation (without credentials)
      run: npx tsx bin/cli.ts validate
      continue-on-error: true

  # API tests disabled for security - all tests now use mocks
  # To enable API tests locally, set GUTTY_TEST_API=true with real credentials

  # Build test removed - this is a TypeScript-native CLI project using tsx